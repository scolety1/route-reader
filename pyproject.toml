[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "route-reader"
version = "0.1.0"
description = "Simulation-first proof for learning personal, time-dependent route performance"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
include = ["route_reader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
